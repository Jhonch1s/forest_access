server:
  port: 8081
  servlet:
    context-path: /forest_access
jwt:
  secret: ${JWT_SECRET:TIP2026}

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        order_updates: true
        order_inserts: true
    show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
